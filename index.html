// ===== 旋转动画演示 =====
function initDrawScene(subId) {
  if (subId === 'rotation') {
    initRotationDemo();
  }
}

function initRotationDemo() {
  DrawState.rotationAngle = 0;
  drawRotationStages(0);
}

function drawRotationStages(angle) {
  drawEthaneStage(angle);
  drawEthyleneStage(angle);
  updatePiBondStatus(angle);
}

function drawEthaneStage(angle) {
  const container = document.getElementById('ethaneStage');
  if (!container) return;
  const w = container.clientWidth, h = container.clientHeight;

  let canvas = container.querySelector('canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.style.width = '100%'; canvas.style.height = '100%';
    container.appendChild(canvas);
  }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  const bondLen = 80;

  // 左侧C（固定）
  const c1x = cx - bondLen / 2, c1y = cy;
  // 右侧C（绕键轴旋转——在2D中用y方向的压缩模拟旋转效果）
  const c2x = cx + bondLen / 2, c2y = cy;

  // σ键（灰色粗线）
  ctx.strokeStyle = '#718096';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(c1x + 20, c1y);
  ctx.lineTo(c2x - 20, c2y);
  ctx.stroke();

  // σ键标签
  ctx.fillStyle = '#4a5568';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('σ键', cx, cy - 16);

  // 左侧C的3个H（固定位置，扇形展开）
  const h1Angle = -Math.PI / 2;
  const h1r = 45;
  for (let i = 0; i < 3; i++) {
    const a = h1Angle + (i - 1) * 0.6;
    const hx = c1x - 15 + Math.cos(a) * h1r * 0.6;
    const hy = c1y + Math.sin(a) * h1r;
    // C-H键
    ctx.strokeStyle = '#a0aec0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(c1x - 15, c1y);
    ctx.lineTo(hx, hy);
    ctx.stroke();
    // H原子
    ctx.beginPath();
    ctx.arc(hx, hy, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#e2e8f0';
    ctx.fill();
    ctx.strokeStyle = '#a0aec0';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#4a5568';
    ctx.font = 'bold 9px sans-serif';
    ctx.fillText('H', hx, hy + 3);
  }

  // 右侧C的3个H（随angle旋转——在2D中用椭圆投影模拟）
  const rotRad = angle * Math.PI / 180;
  for (let i = 0; i < 3; i++) {
    const baseAngle = -Math.PI / 2 + (i - 1) * 0.6;
    // 旋转：x方向不变（沿键轴方向投影），y方向用cos(rotRad)压缩
    const localX = Math.cos(baseAngle) * h1r * 0.6;
    const localY = Math.sin(baseAngle) * h1r;
    // 绕x轴旋转：y' = y*cos - z*sin, z' = y*sin + z*cos
    // 假设初始z=0，则 y' = y*cos(rot), z' = y*sin(rot)
    const projectedY = localY * Math.cos(rotRad);
    const depth = localY * Math.sin(rotRad); // 用于大小/透明度
    const hx = c2x + 15 + localX;
    const hy = c2y + projectedY;
    const scale = 0.7 + 0.3 * (1 + Math.cos(rotRad) * Math.sign(localY || 1)) / 2;
    const alpha = 0.5 + 0.5 * (depth >= 0 ? 1 : 0.4);

    // C-H键
    ctx.strokeStyle = `rgba(160,174,192,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(c2x + 15, c2y);
    ctx.lineTo(hx, hy);
    ctx.stroke();
    // H原子
    ctx.beginPath();
    ctx.arc(hx, hy, 10 * scale, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(226,232,240,${alpha})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(160,174,192,${alpha})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = `rgba(74,85,104,${alpha})`;
    ctx.font = `bold ${9 * scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('H', hx, hy + 3);
  }

  // 两个C原子
  [{ x: c1x, y: c1y }, { x: c2x, y: c2y }].forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#404040';
    ctx.fill();
    ctx.strokeStyle = '#2d3748';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('C', c.x, c.y);
  });

  // 旋转角度标注
  ctx.fillStyle = '#2c9aa0';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`旋转 ${angle}°`, cx, h - 20);
}

function drawEthyleneStage(angle) {
  const container = document.getElementById('ethyleneStage');
  if (!container) return;
  const w = container.clientWidth, h = container.clientHeight;

  let canvas = container.querySelector('canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.style.width = '100%'; canvas.style.height = '100%';
    container.appendChild(canvas);
  }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  const bondLen = 80;
  const c1x = cx - bondLen / 2, c1y = cy;
  const c2x = cx + bondLen / 2, c2y = cy;
  const rotRad = angle * Math.PI / 180;
  const piBreakProgress = Math.min(1, angle / 90); // 90度时π键完全断裂

  // σ键（灰色，始终完整）
  ctx.strokeStyle = '#718096';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(c1x + 18, c1y);
  ctx.lineTo(c2x - 18, c2y);
  ctx.stroke();
  ctx.fillStyle = '#4a5568';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('σ键（完整）', cx, cy + 30);

  // π键（红色/橙色，随旋转逐渐断裂）
  // π键电子云：在双键平面上下两侧的椭圆形区域
  const piAlpha = 1 - piBreakProgress * 0.8;
  const piOffset = 18;

  // 上方π电子云
  ctx.strokeStyle = `rgba(224,102,102,${piAlpha})`;
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  // 左侧p轨道上叶
  const leftTopY = c1y - piOffset - Math.sin(rotRad) * 20 * piBreakProgress;
  const rightTopY = c2y - piOffset + Math.sin(rotRad) * 20 * piBreakProgress;
  ctx.moveTo(c1x, leftTopY - 15);
  ctx.quadraticCurveTo(cx, cy - piOffset - 25, c2x, rightTopY - 15);
  ctx.stroke();
  // 下方p轨道
  const leftBotY = c1y + piOffset - Math.sin(rotRad) * 20 * piBreakProgress;
  const rightBotY = c2y + piOffset + Math.sin(rotRad) * 20 * piBreakProgress;
  ctx.moveTo(c1x, leftBotY + 15);
  ctx.quadraticCurveTo(cx, cy + piOffset + 25, c2x, rightBotY + 15);
  ctx.stroke();
  ctx.setLineDash([]);

  // π键标签
  ctx.fillStyle = `rgba(197,48,48,${piAlpha})`;
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  if (piBreakProgress < 0.5) {
    ctx.fillText('π键（肩并肩重叠）', cx, cy - piOffset - 35);
  } else if (piBreakProgress < 1) {
    ctx.fillText('π键正在断裂…', cx, cy - piOffset - 35);
  } else {
    ctx.fillStyle = '#c53030';
    ctx.fillText('π键已断裂！', cx, cy - piOffset - 35);
  }

  // 断裂效果：当angle>90时，显示断裂的碎片
  if (piBreakProgress >= 1) {
    ctx.fillStyle = 'rgba(197,48,48,0.6)';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('✕', cx - 30, cy - piOffset - 10);
    ctx.fillText('✕', cx + 30, cy - piOffset - 10);
  }

  // 左侧C的2个H（固定，平面内）
  for (let i = 0; i < 2; i++) {
    const a = -Math.PI / 2 + (i === 0 ? -0.7 : 0.7);
    const hx = c1x - 10 + Math.cos(a) * 45;
    const hy = c1y + Math.sin(a) * 45;
    ctx.strokeStyle = '#a0aec0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(c1x - 10, c1y); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, hy, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#e2e8f0'; ctx.fill(); ctx.strokeStyle = '#a0aec0'; ctx.stroke();
    ctx.fillStyle = '#4a5568'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('H', hx, hy + 3);
  }

  // 右侧C的2个H（随angle旋转——模拟p轨道扭转）
  for (let i = 0; i < 2; i++) {
    const baseA = -Math.PI / 2 + (i === 0 ? -0.7 : 0.7);
    const localX = Math.cos(baseA) * 45;
    const localY = Math.sin(baseA) * 45;
    const projectedY = localY * Math.cos(rotRad);
    const depth = localY * Math.sin(rotRad);
    const hx = c2x + 10 + localX;
    const hy = c2y + projectedY;
    const alpha = 0.5 + 0.5 * (depth >= 0 ? 1 : 0.4);
    const scale = 0.75 + 0.25 * Math.abs(Math.cos(rotRad));

    ctx.strokeStyle = `rgba(160,174,192,${alpha})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(c2x + 10, c2y); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, hy, 10 * scale, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(226,232,240,${alpha})`; ctx.fill();
    ctx.strokeStyle = `rgba(160,174,192,${alpha})`; ctx.stroke();
    ctx.fillStyle = `rgba(74,85,104,${alpha})`; ctx.font = `bold ${9 * scale}px sans-serif`;
    ctx.textAlign = 'center'; ctx.fillText('H', hx, hy + 3);
  }

  // C原子
  [{ x: c1x, y: c1y }, { x: c2x, y: c2y }].forEach(c => {
    ctx.beginPath(); ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
    ctx.fillStyle = '#404040'; ctx.fill();
    ctx.strokeStyle = '#2d3748'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('C', c.x, c.y);
  });

  // 角度标注
  ctx.fillStyle = piBreakProgress >= 1 ? '#c53030' : '#e07a3f';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(`强行旋转 ${angle}°`, cx, h - 20);
}

function updatePiBondStatus(angle) {
  const status = document.getElementById('piBondStatus');
  if (!status) return;
  if (angle < 30) {
    status.className = 'pi-bond-indicator intact';
    status.textContent = 'π键完整：p轨道平行重叠';
  } else if (angle < 90) {
    status.className = 'pi-bond-indicator breaking';
    status.textContent = `π键正在断裂：p轨道夹角增大，重叠减弱（${Math.round(angle/90*100)}%）`;
  } else {
    status.className = 'pi-bond-indicator broken';
    status.textContent = 'π键已断裂：p轨道垂直，无重叠——这就是双键不能旋转的原因！';
  }
}

function setRotationAngle(angle) {
  DrawState.rotationAngle = parseInt(angle);
  const display = document.getElementById('rotAngleDisplay');
  if (display) display.textContent = angle;
  drawRotationStages(DrawState.rotationAngle);
}

function toggleRotationAnim() {
  const btn = document.getElementById('rotPlayBtn');
  if (DrawState.rotationAnimId) {
    cancelAnimationFrame(DrawState.rotationAnimId);
    DrawState.rotationAnimId = null;
    if (btn) btn.textContent = '播放旋转';
  } else {
    if (btn) btn.textContent = '暂停';
    let angle = DrawState.rotationAngle;
    let direction = 1;
    const step = () => {
      angle += direction * 1.5;
      if (angle >= 180) { angle = 180; direction = -1; }
      if (angle <= 0) { angle = 0; direction = 1; }
      DrawState.rotationAngle = angle;
      const slider = document.getElementById('rotationSlider');
      const display = document.getElementById('rotAngleDisplay');
      if (slider) slider.value = angle;
      if (display) display.textContent = Math.round(angle);
      drawRotationStages(angle);
      DrawState.rotationAnimId = requestAnimationFrame(step);
    };
    step();
  }
}

function resetRotation() {
  if (DrawState.rotationAnimId) {
    cancelAnimationFrame(DrawState.rotationAnimId);
    DrawState.rotationAnimId = null;
    const btn = document.getElementById('rotPlayBtn');
    if (btn) btn.textContent = '播放旋转';
  }
  setRotationAngle(0);
  const slider = document.getElementById('rotationSlider');
  if (slider) slider.value = 0;
}

// ===== 绘图模块初始化（在页面渲染后调用） =====
// 重写render函数后需要在draw模块页面初始化画布
// 通过在render()中检测当前路由来初始化

// 保存原始render引用并扩展
const _originalRender = render;
render = function() {
  _originalRender();
  // 如果当前是draw模块的editor页面，初始化画布
  if (AppState.currentRoute === 'draw' && (AppState.currentSubPage === 'editor' || !AppState.currentSubPage)) {
    setTimeout(() => { initDrawCanvas(); handlePendingImport3D(); }, 30);
  }
  if (AppState.currentRoute === 'draw' && AppState.currentSubPage === 'rotation') {
    setTimeout(() => { initRotationDemo(); }, 30);
  }
  };


// ===== 初始化 =====
function init() {
  buildSearchIndex();
  loadSavedStructuresFromStorage();
  applyLegacyRouteMode();
  render();
}


// 启动
init();
</script>
