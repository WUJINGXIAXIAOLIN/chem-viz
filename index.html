function renderPrinciplePage(subId) {
  const modName = {
    collision: '有效碰撞与活化能',
    equilibrium: '化学平衡移动',
    electrolyte: '弱电解质电离与盐类水解',
    galvanic: '原电池',
    electrolysis: '电解池'
  }[subId] || '化学反应原理';

  const commonHint = `<div class="tip-box info" style="margin-top:14px;"><strong>使用说明</strong>拖动滑块 / 点击按钮调节条件，观察动画与右侧说明同步变化。动画为原理示意，非真实实验。</div>`;

  if (subId === 'collision') return `
    <div class="card">
      <div class="card-title">有效碰撞与活化能（动态分子碰撞模型）</div>
      <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; display:flex; gap:18px; flex-wrap:wrap; align-items:center;">
        <label style="font-size:13px; color:var(--text-secondary);">温度
          <input type="range" id="collisionTemp" min="1" max="10" value="5" oninput="setCollisionTemp(this.value)" style="vertical-align:middle; accent-color:#4fd1c5;">
          <span id="collisionTempVal" style="color:#4fd1c5; font-weight:700;">5</span>
        </label>
        <label style="font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="collisionCat" onchange="setCollisionCat(this.checked)"> 催化剂（活化能 Ea 降低）
        </label>
        <label style="font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="collisionVec" onchange="setCollisionVec(this.checked)" checked> 显示速度向量
        </label>
        <button class="btn" onclick="resetCollision()">重置</button>
      </div>
      <div class="module-grid" style="grid-template-columns: 1.3fr 1fr;">
        <div>
          <canvas id="collisionCanvas" width="700" height="360" style="width:100%; height:auto; background:#0f172a; border-radius:10px; border:1px solid var(--border);"></canvas>
          <div style="display:flex; gap:20px; margin-top:10px; font-size:13px; flex-wrap:wrap;">
            <span>活化分子：<b id="collisionActive" style="color:#fbbf24;">0</b>（<span id="collisionActivePct" style="color:#fbbf24;">0%</span>）</span>
            <span>碰撞次数：<b id="collisionCount" style="color:#4fd1c5;">0</b></span>
            <span>有效碰撞：<b id="collisionEff" style="color:#68d391;">0</b></span>
            <span>有效率：<b id="collisionRate" style="color:#fc8181;">—</b></span>
          </div>
          <div style="margin-top:8px; font-size:12px; color:var(--text-muted);">
            金色描边 = 活化分子（动能达到活化能，碰撞才可能有效）· 容器底部横条 = 分子动能分布，虚线为活化能门槛 Ea：<b style="color:#fbbf24;">升温使更多分子越过 Ea</b>，<b style="color:#94a3b8;">加催化剂使 Ea 线左移</b>，两者都让活化分子百分数增大。
          </div>
          <div class="tip-box exam" style="margin-top:12px;">
            <strong>考点</strong>分子必须发生<u>有效碰撞</u>才能反应：①是活化分子（动能 ≥ 活化能 Ea）；②碰撞取向合适。
            <br>· 升温：分子平均动能增大 → <b style="color:#fbbf24;">活化分子百分数增大</b> → 有效碰撞增多（碰撞频率也略有增加）
            <br>· 催化剂：<b style="color:#94a3b8;">降低活化能 Ea</b> → 原本够不着的分子"够得着"了 → 活化分子百分数增大（不改变平衡）
            <br>· 有效碰撞才能生成产物；取向不对再高的能量也白撞。
          </div>
        </div>
        <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:16px; align-self:start;">
          <div style="font-weight:700; font-size:14px; margin-bottom:8px;">能量—反应进程图</div>
          <svg viewBox="0 0 320 230" style="width:100%;">
            <line x1="30" y1="200" x2="310" y2="200" stroke="#475569" stroke-width="1.5"/>
            <line x1="30" y1="20" x2="30" y2="200" stroke="#475569" stroke-width="1.5"/>
            <text x="150" y="218" fill="#94a3b8" font-size="11" text-anchor="middle">反应进程</text>
            <text x="12" y="100" fill="#94a3b8" font-size="11" transform="rotate(-90 12 100)" text-anchor="middle">能量</text>
            <line x1="50" y1="160" x2="120" y2="160" stroke="#4fd1c5" stroke-width="2.5"/>
            <circle cx="50" cy="160" r="3" fill="#4fd1c5"/>
            <text x="52" y="148" fill="#4fd1c5" font-size="11">反应物</text>
            <path d="M120 160 Q 170 60 220 70" stroke="#f6ad55" stroke-width="2.5" fill="none"/>
            <text x="170" y="52" fill="#f6ad55" font-size="11" text-anchor="middle">活化络合物</text>
            <line x1="220" y1="70" x2="290" y2="70" stroke="#fc8181" stroke-width="2.5"/>
            <circle cx="290" cy="70" r="3" fill="#fc8181"/>
            <text x="240" y="58" fill="#fc8181" font-size="11">生成物</text>
            <line x1="135" y1="160" x2="135" y2="82" stroke="#4fd1c5" stroke-width="1" stroke-dasharray="3,3"/>
            <text x="140" y="125" fill="#4fd1c5" font-size="10">Ea(正)</text>
            <line x1="215" y1="70" x2="215" y2="145" stroke="#fc8181" stroke-width="1" stroke-dasharray="3,3"/>
            <text x="222" y="112" fill="#fc8181" font-size="10">Ea(逆)</text>
            <line x1="290" y1="160" x2="290" y2="70" stroke="#a78bfa" stroke-width="2"/>
            <text x="296" y="120" fill="#a78bfa" font-size="10">ΔH&lt;0</text>
            <path d="M120 160 Q 170 110 220 95" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
            <text x="120" y="118" fill="#94a3b8" font-size="10">加催化剂：Ea↓</text>
          </svg>
          <div style="font-size:12px; color:var(--text-muted); margin-top:8px; line-height:1.8;">
            活化能 Ea：普通分子变为活化分子所需的最低能量。<br>
            催化剂同时降低正、逆反应活化能（幅度相同），<b style="color:#f6ad55;">不改变平衡与 ΔH</b>。
          </div>
        </div>
      </div>
    </div>
  `;

  if (subId === 'equilibrium') return `
    <div class="card">
      <div class="card-title">化学平衡移动（合成氨型：N₂ + 3H₂ ⇌ 2NH₃ 示意）</div>
      <div class="module-grid" style="grid-template-columns: 1.3fr 1fr;">
        <div>
          <canvas id="equilibriumCanvas" width="700" height="340" style="width:100%; height:auto; background:#0f172a; border-radius:10px; border:1px solid var(--border);"></canvas>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
            <button class="btn" onclick="eqAdd('A')">＋N₂浓度</button>
            <button class="btn" onclick="eqAdd('B')">＋H₂浓度</button>
            <button class="btn" onclick="eqPressure(1.4)">增大压强</button>
            <button class="btn" onclick="eqTemperature(1)">升温</button>
            <button class="btn" onclick="eqTemperature(-1)">降温</button>
            <button class="btn" onclick="eqReset()">重置</button>
          </div>
          <div style="display:flex; gap:8px; align-items:center; margin-top:10px; font-size:13px;">
            <span style="color:var(--text-secondary);">正反应方向：</span>
            <label style="color:var(--text-secondary); font-size:12px; display:flex; align-items:center; gap:4px;">
              <input type="radio" name="eqDH" checked onchange="eqSetDH('exo')"> 放热
            </label>
            <label style="color:var(--text-secondary); font-size:12px; display:flex; align-items:center; gap:4px;">
              <input type="radio" name="eqDH" onchange="eqSetDH('endo')"> 吸热
            </label>
          </div>
          <div style="display:flex; gap:16px; margin-top:8px; font-size:13px;">
            <span>正反应速率 <b id="eqVFor" style="color:#4fd1c5;">—</b></span>
            <span>逆反应速率 <b id="eqVRev" style="color:#f6ad55;">—</b></span>
            <span id="eqTip" style="color:#94a3b8;">平衡状态：v正 = v逆</span>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px;">
            <div style="font-weight:700; font-size:14px; margin-bottom:8px;">速率变化（v正 蓝 / v逆 橙）</div>
            <div style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary);">
              <span style="width:40px;">v正</span>
              <div style="flex:1; height:14px; background:#1e293b; border-radius:7px; overflow:hidden;">
                <div id="eqVForBar" style="height:100%; width:50%; background:#4fd1c5; transition:width 0.3s;"></div>
              </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--text-secondary);">
              <span style="width:40px;">v逆</span>
              <div style="flex:1; height:14px; background:#1e293b; border-radius:7px; overflow:hidden;">
                <div id="eqVRevBar" style="height:100%; width:50%; background:#f6ad55; transition:width 0.3s;"></div>
              </div>
            </div>
          </div>
          <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px;">
            <div style="font-weight:700; font-size:14px; margin-bottom:8px;">粒子计数</div>
            <div id="eqCounts" style="font-size:13px; line-height:1.9; color:var(--text-secondary);"></div>
          </div>
          <div class="tip-box exam">
            <strong>勒夏特列原理</strong>改变影响平衡的条件，平衡向<u>减弱这种改变</u>的方向移动：
            <br>· 增大 N₂/H₂ 浓度 → 正移（消耗新增物质）
            <br>· 增大压强 → 向气体分子数减小的方向（正）移动
            <br>· 升温 → 向<u>吸热</u>方向移动（正反应放热时逆移）
            <br>· 催化剂只同倍改变正逆速率，<b style="color:#f6ad55;">平衡不移动</b>
            <br>· 达到新平衡：各组分浓度与原平衡<u>不同</u>，但 v正' = v逆'
          </div>
        </div>
      </div>
      ${commonHint}
    </div>
  `;

  if (subId === 'electrolyte') return `
    <div class="card">
      <div class="card-title">弱电解质电离与盐类水解（${modName}）</div>
      <div class="module-grid" style="grid-template-columns: 1.3fr 1fr;">
        <div>
          <canvas id="electrolyteCanvas" width="700" height="340" style="width:100%; height:auto; background:#0f172a; border-radius:10px; border:1px solid var(--border);"></canvas>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
            <button class="btn" onclick="elyAdd('HA')">＋CH₃COOH</button>
            <button class="btn" onclick="elyAdd('H')">＋H⁺（加酸）</button>
            <button class="btn" onclick="elyDilute()">加水稀释</button>
            <button class="btn" onclick="elyReset()">重置</button>
          </div>
          <div style="display:flex; gap:20px; margin-top:10px; font-size:13px; flex-wrap:wrap;">
            <span>电离度 α：<b id="elyAlpha" style="color:#4fd1c5;">—</b></span>
            <span>CH₃COOH <b style="color:#f6ad55;" id="elyHA">0</b> · CH₃COO⁻ <b style="color:#fc8181;" id="elyAc">0</b> · H⁺ <b style="color:#e2e8f0;" id="elyH">0</b></span>
          </div>
          <div class="tip-box exam" style="margin-top:12px;">
            <strong>考点</strong>CH₃COOH ⇌ CH₃COO⁻ + H⁺（弱电解质部分电离，存在电离平衡）：
            <br>· <u>加水稀释</u>：c(H⁺) 减小，但<b style="color:#f6ad55;">电离度 α 增大</b>（越稀越电离）——两者不矛盾！
            <br>· 加 CH₃COOH：平衡右移，但 α 减小（浓度增大抑制电离度）
            <br>· 加 H⁺（同离子效应）：平衡左移，抑制电离
            <br>· 升温：电离吸热，α 增大
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px;">
            <div style="font-weight:700; font-size:14px; margin-bottom:6px;">电离平衡动态</div>
            <div style="font-size:12px; color:var(--text-muted); line-height:1.8;">
              黄色双球 = CH₃COOH 分子（未电离）<br>
              红色大球 = CH₃COO⁻ · 白色小球 = H⁺<br>
              分子不断电离、离子不断结合，双向同时进行。
            </div>
          </div>
          <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px;">
            <div style="font-weight:700; font-size:14px; margin-bottom:6px;">盐类水解（CH₃COONa）</div>
            <div style="font-size:13px; color:var(--text-secondary); line-height:1.9;">

            <br>· 判断正负极看"谁失电子谁负极"（较活泼金属一般作负极，但要看电解质环境）

  return `

// ===== 化学反应原理动画（v0.10） =====
function startPrincipleLoop() {
  if (PrincipleState.rafId) return;
  const step = () => {
    const keys = Object.keys(PrincipleState.anims);
    keys.forEach(k => { const a = PrincipleState.anims[k]; if (a && a.step) a.step(); });
    if (keys.length) PrincipleState.rafId = requestAnimationFrame(step);
    else PrincipleState.rafId = null;
  };
  PrincipleState.rafId = requestAnimationFrame(step);
}
function initPrincipleAnim(subId) {
  PrincipleState.cleanup();
  if (subId === 'collision') initCollisionAnim();
  else if (subId === 'equilibrium') initEquilibriumAnim();
  else if (subId === 'electrolyte') initElectrolyteAnim();
  else if (subId === 'galvanic') initGalvanicAnim();
  else if (subId === 'electrolysis') initElectrolysisAnim();
  startPrincipleLoop();
}

// ========== 1. 有效碰撞与活化能（动态分子碰撞模型 v0.11） ==========
let collision = null;
function initCollisionAnim() {
  const canvas = document.getElementById('collisionCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  collision = {
    canvas, ctx, temp: 5, cat: false, showVectors: true,
    collisions: 0, eff: 0, texts: [], molecules: []
  };
  ['A','A','A','A','B','B','B','B'].forEach(t => {
    collision.molecules.push(newCollisionMolecule(t));
  });
  PrincipleState.anims.collision = { step: stepCollision };
}
// 新建一个分子（随机位置/速度/朝向）
function newCollisionMolecule(type) {
  const c = collision;
  const ang = Math.random() * Math.PI * 2;
  const sp = 0.5 + Math.random() * 1.1;          // 初始速度大小（后续由温度动态维持）
  return {
    x: 55 + Math.random() * 590, y: 40 + Math.random() * 230,
    vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
    type: type, angle: Math.random() * Math.PI * 2, r: 10,
    ke: 0, active: false
  };
}
// 当前活化能阈值（催化剂降低）
function collisionEa() { return collision.cat ? 3.2 : 6.0; }
// 当前平均速率（温度）
function collisionSpeed() { return 0.55 + collision.temp * 0.17; }
function stepCollision() {
  const c = collision;
  const cv = c.canvas, ctx = c.ctx;
  const W = cv.width, H = cv.height;
  const MARGIN = 16;
  const DIST_H = H - 66;                    // 分子运动区高度（底部留能量分布条）
  ctx.clearRect(0, 0, W, H);
  // 容器
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.strokeRect(MARGIN, MARGIN, W - 2 * MARGIN, DIST_H - MARGIN);
  const ea = collisionEa();
  const avgSp = collisionSpeed();
  const mols = c.molecules;

  // ---- 速度更新（维持温度分布：随机微调速度大小） ----
  mols.forEach(m => {
    if (Math.random() < 0.02) {
      const cur = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
      const target = avgSp * (0.45 + Math.random() * 1.1);
      const k = target / cur;
      m.vx *= k; m.vy *= k;
    }
    // 若速度过慢（产物）也允许随机扰动
    m.x += m.vx; m.y += m.vy;
    m.angle += 0.01 + Math.random() * 0.02;
    if (m.x < MARGIN + m.r) { m.x = MARGIN + m.r; m.vx = Math.abs(m.vx); }
    if (m.x > W - MARGIN - m.r) { m.x = W - MARGIN - m.r; m.vx = -Math.abs(m.vx); }
    if (m.y < MARGIN + m.r) { m.y = MARGIN + m.r; m.vy = Math.abs(m.vy); }
    if (m.y > DIST_H - MARGIN - m.r) { m.y = DIST_H - MARGIN - m.r; m.vy = -Math.abs(m.vy); }
    // 动能与活化判定
    m.ke = m.vx * m.vx + m.vy * m.vy;
    m.active = m.ke > ea;
  });

  // ---- 碰撞检测 ----
  for (let i = 0; i < mols.length; i++) {
    for (let j = i + 1; j < mols.length; j++) {
      const a = mols[i], b = mols[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > (a.r + b.r) * (a.r + b.r)) continue;
      // 相对动能（判断碰撞激烈程度）
      const relKe = ((a.vx - b.vx) * (a.vx - b.vx) + (a.vy - b.vy) * (a.vy - b.vy)) * 0.5;
      // 取向：A 的朝向与碰撞连线夹角（|cos| 大 → 端对端取向好）
      const dirLen = Math.sqrt(d2) || 1;
      const cosA = Math.abs((Math.cos(a.angle) * dx + Math.sin(a.angle) * dy) / dirLen);
      const cosB = Math.abs((Math.cos(b.angle) * dx + Math.sin(b.angle) * dy) / dirLen);
      const orient = Math.min(cosA, cosB);
      const isReact = (a.type === 'A' && b.type === 'B') || (a.type === 'B' && b.type === 'A');
      if (isReact && relKe > ea && orient > 0.55) {
        // ===== 有效碰撞：生成产物 =====
        c.eff++;
        c.collisions++;
        const px = (a.x + b.x) / 2, py = (a.y + b.y) / 2;
        a.type = 'C'; b.type = 'C';
        a.angle = Math.random() * Math.PI * 2; b.angle = Math.random() * Math.PI * 2;
        const k = 0.3;
        a.vx *= k; b.vx *= k; a.vy *= k; b.vy *= k;
        pushCollisionText(px, py - 22, '有效碰撞 ✓', '#68d391');
        pushCollisionFlash(px, py);
      } else {
        // 无效碰撞：弹性反弹
        c.collisions++;
        const tvx = a.vx; a.vx = b.vx; b.vx = tvx;
        const tvy = a.vy; a.vy = b.vy; b.vy = tvy;
        if (Math.random() < 0.25) {
          pushCollisionText((a.x + b.x) / 2, (a.y + b.y) / 2 - 20, isReact ? '无效碰撞' : '碰撞', '#64748b');
        }
      }
    }
  }

  // ---- 绘制分子 ----
  mols.forEach(m => {
    const col = m.type === 'A' ? '#fc8181' : m.type === 'B' ? '#63b3ed' : '#68d391';
    ctx.save();
    // 活化分子：金色描边 + 光晕
    if (m.active) {
      ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 14;
      ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1;
    }
    if (m.type === 'C') {
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('AB', m.x, m.y);
    } else {
      // 双原子分子：主球 + 朝向副球 + 键
      const s = m.r * 1.7;
      const ox = Math.cos(m.angle) * s, oy = Math.sin(m.angle) * s;
      ctx.beginPath(); ctx.arc(m.x + ox, m.y + oy, m.r * 0.8, 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(m.x + Math.cos(m.angle) * m.r * 0.4, m.y + Math.sin(m.angle) * m.r * 0.4);
      ctx.lineTo(m.x + ox - Math.cos(m.angle) * m.r * 0.4, m.y + oy - Math.sin(m.angle) * m.r * 0.4);
      ctx.stroke();
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(m.type === 'A' ? 'A₂' : 'B₂', m.x, m.y);
    }
    // 速度向量
    if (c.showVectors && !(m.type === 'C' && m.vx * m.vx + m.vy * m.vy < 0.5)) {
      const vl = Math.sqrt(m.ke) * 6;
      if (vl > 3) {
        ctx.strokeStyle = m.active ? 'rgba(251,191,36,0.85)' : 'rgba(148,163,184,0.6)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x + (m.vx / (Math.sqrt(m.ke) || 1)) * vl, m.y + (m.vy / (Math.sqrt(m.ke) || 1)) * vl);
        ctx.stroke();
      }
    }
    ctx.restore();
  });

  // ---- 底部能量分布条（分子动能 vs 活化能门槛） ----
  const barY = DIST_H + 8, barH = 44;
  ctx.fillStyle = '#111827'; ctx.fillRect(MARGIN, barY, W - 2 * MARGIN, barH);
  ctx.strokeStyle = '#334155'; ctx.strokeRect(MARGIN, barY, W - 2 * MARGIN, barH);
  ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('动能分布 →', MARGIN + 4, barY - 4);
  const maxKe = Math.max.apply(null, mols.map(m => m.ke).concat([10]));
  const xs = MARGIN + 6, xe = W - MARGIN - 6;
  // 活化能门槛线（Ea）
  const eaX = xs + (xe - xs) * Math.min(0.92, ea / maxKe);
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
  ctx.beginPath(); ctx.moveTo(eaX, barY - 10); ctx.lineTo(eaX, barY + barH + 4); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#fbbf24';
  ctx.fillText('Ea', Math.min(eaX + 2, xe - 18), barY - 12);
  // 每个分子的动能点
  mols.forEach(m => {
    const px = xs + (xe - xs) * Math.min(0.95, m.ke / maxKe);
    const py = barY + 8 + Math.random() * (barH - 18);
    ctx.beginPath(); ctx.arc(px, py, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = m.active ? '#fbbf24' : '#64748b';
    ctx.fill();
  });
  ctx.fillStyle = '#64748b'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('活化区 →', xe - 2, barY - 4);

  // ---- 碰撞效果（闪光 + 飘字） ----
  c.texts.forEach(t => {
    t.life--;
    if (t.life <= 0) return;
    if (t.kind === 'flash') {
      ctx.beginPath(); ctx.arc(t.x, t.y, 26 * (1 - t.life / 14), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(104,211,145,' + (t.life / 14 * 0.5) + ')'; ctx.fill();
    } else {
      ctx.globalAlpha = Math.min(1, t.life / 12);
      ctx.fillStyle = t.color; ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t.text, t.x, t.y - (14 - t.life) * 0.6);
      ctx.globalAlpha = 1;
    }
  });
  c.texts = c.texts.filter(t => t.life > 0);

  // ---- 统计面板 ----
  const actives = mols.filter(m => m.active).length;
  const actEl = document.getElementById('collisionActive'); if (actEl) actEl.textContent = actives;
  const pctEl = document.getElementById('collisionActivePct');
  if (pctEl) pctEl.textContent = Math.round(actives / mols.length * 100) + '%';
  const cntEl = document.getElementById('collisionCount'); if (cntEl) cntEl.textContent = c.collisions;
  const effEl = document.getElementById('collisionEff'); if (effEl) effEl.textContent = c.eff;
  const rateEl = document.getElementById('collisionRate');
  if (rateEl) rateEl.textContent = c.collisions ? (c.eff / c.collisions * 100).toFixed(1) + '%' : '—';
}
// 碰撞文字
function pushCollisionText(x, y, text, color) {
  collision.texts.push({ kind: 'text', x, y, text, color, life: 26 });
}
// 碰撞闪光
function pushCollisionFlash(x, y) {
  collision.texts.push({ kind: 'flash', x, y, life: 14 });
}
function setCollisionTemp(v) {
  if (!collision) return;
  collision.temp = parseFloat(v);
  const el = document.getElementById('collisionTempVal'); if (el) el.textContent = v;
}
function setCollisionCat(on) { if (collision) collision.cat = on; }
function setCollisionVec(on) { if (collision) collision.showVectors = on; }
function resetCollision() {
  if (!collision) return;
  collision.collisions = 0; collision.eff = 0; collision.texts = [];
  collision.molecules = [];
  ['A','A','A','A','B','B','B','B'].forEach(t => collision.molecules.push(newCollisionMolecule(t)));
}
// ========== 2. 化学平衡移动 ==========
let equilibrium = null;
function initEquilibriumAnim() {
  const canvas = document.getElementById('equilibriumCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  equilibrium = {
    canvas, ctx, nA: 6, nB: 8, nAB: 4, kFor: 0.0018, kRev: 0.0009,
    dH: 'exo', tip: '', tipColor: '#94a3b8', flash: 0, tipTime: 0,
    particles: []
  };
  buildEqParticles();
  PrincipleState.anims.equilibrium = { step: stepEquilibrium };
}
function buildEqParticles() {
  const eq = equilibrium;
  eq.particles = [];
  for (let i = 0; i < eq.nA; i++) eq.particles.push({ kind: 'a', x: 40 + Math.random() * 420, y: 40 + Math.random() * 260, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 1.6 });
  for (let i = 0; i < eq.nB; i++) eq.particles.push({ kind: 'b', x: 40 + Math.random() * 420, y: 40 + Math.random() * 260, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 1.6 });
  for (let i = 0; i < eq.nAB; i++) eq.particles.push({ kind: 'ab', x: 40 + Math.random() * 420, y: 40 + Math.random() * 260, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 1.6 });
}
function eqRates() {
  const eq = equilibrium;
  const vFor = eq.kFor * eq.nA * eq.nB;
  const vRev = eq.kRev * eq.nAB * eq.nAB;
  return { vFor, vRev };
}
function stepEquilibrium() {
  const eq = equilibrium;
  const cv = eq.canvas, ctx = eq.ctx;
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2; ctx.strokeRect(10, 10, W - 20, H - 20);
  if (eq.flash > 0) { ctx.fillStyle = 'rgba(246,173,85,0.12)'; ctx.fillRect(10, 10, W - 20, H - 20); eq.flash--; }
  // 分子随机运动
  eq.particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 30 || p.x > W - 30) p.vx *= -1;
    if (p.y < 30 || p.y > H - 30) p.vy *= -1;
  });
  // 正逆反应（概率模型）
  const { vFor, vRev } = eqRates();
  if (Math.random() < vFor && eq.nA > 0 && eq.nB > 0) {
    eq.nA--; eq.nB--; eq.nAB++;
    const idxA = eq.particles.findIndex(p => p.kind === 'a');
    const idxB = eq.particles.findIndex(p => p.kind === 'b');
    if (idxA >= 0 && idxB >= 0) { eq.particles.splice(idxB, 1); eq.particles.splice(idxA, 1); }
    eq.particles.push({ kind: 'ab', x: 60 + Math.random() * 380, y: 40 + Math.random() * 240, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 1.6 });
  }
  if (Math.random() < vRev && eq.nAB > 0) {
    eq.nAB--; eq.nA++; eq.nB++;
    const idxAB = eq.particles.findIndex(p => p.kind === 'ab');
    if (idxAB >= 0) eq.particles.splice(idxAB, 1);
    eq.particles.push({ kind: 'a', x: 60 + Math.random() * 380, y: 40 + Math.random() * 240, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 1.6 });
    eq.particles.push({ kind: 'b', x: 60 + Math.random() * 380, y: 40 + Math.random() * 240, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 1.6 });
  }

  eq.particles.forEach(p => {

    else { drawPair(ctx, p, '#68d391', 'NH'); }
  });
  // 速率条
  const maxV = Math.max(vFor, vRev, 1e-6);
  const barFor = document.getElementById('eqVForBar');
  const barRev = document.getElementById('eqVRevBar');
  if (barFor) barFor.style.width = Math.min(100, vFor / maxV * 100) + '%';
  if (barRev) barRev.style.width = Math.min(100, vRev / maxV * 100) + '%';
  const vfEl = document.getElementById('eqVFor'); if (vfEl) vfEl.textContent = vFor.toFixed(3);
  const vrEl = document.getElementById('eqVRev'); if (vrEl) vrEl.textContent = vRev.toFixed(3);
  const tipEl = document.getElementById('eqTip');
  if (tipEl) { tipEl.textContent = eq.tip || (Math.abs(vFor - vRev) < 0.005 * Math.max(vFor, vRev) ? '平衡状态：v正 = v逆' : '正在移动：v正 ≠ v逆 →'); tipEl.style.color = eq.tipColor; }
  const cntEl = document.getElementById('eqCounts');
  if (cntEl) cntEl.innerHTML = 'N₂：<b style="color:#fc8181;">' + eq.nA + '</b> · H₂：<b style="color:#63b3ed;">' + eq.nB + '</b> · NH₃：<b style="color:#68d391;">' + eq.nAB + '</b>';
}
function drawPair(ctx, p, color, label) {

  ctx.fillStyle = color; ctx.fill();
  ctx.beginPath(); ctx.moveTo(p.x - 4, p.y); ctx.lineTo(p.x - 11, p.y); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#0f172a'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, p.x - 7, p.y);
}
function eqAdd(which) {

}
function eqPressure(factor) {

}
function eqTemperature(dir) {

let electrolyte = null;
function initElectrolyteAnim() {
  const canvas = document.getElementById('electrolyteCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  electrolyte = {
    canvas, ctx, particles: [], pIon: 0.008, pAssoc: 0.012, dilute: 1
  };
  // 初始：8 个 CH₃COOH + 2 对离子
  for (let i = 0; i < 8; i++) electrolyte.particles.push({ kind: 'ha', x: 40 + Math.random() * 520, y: 40 + Math.random() * 260, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5 });
  for (let i = 0; i < 2; i++) {
    electrolyte.particles.push({ kind: 'ac', x: 120 + Math.random() * 400, y: 60 + Math.random() * 200, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5 });
    electrolyte.particles.push({ kind: 'h', x: 130 + Math.random() * 400, y: 60 + Math.random() * 200, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5 });
  }
  PrincipleState.anims.electrolyte = { step: stepElectrolyte };
}
function stepElectrolyte() {
  const e = electrolyte;
  const cv = e.canvas, ctx = e.ctx;
  const W = cv.width, H = cv.height;
  const margin = 20;
  // 稀释时扩大活动空间（模拟加水：浓度↓）
  const area = margin + (e.dilute - 1) * 60;
  ctx.clearRect(0, 0, W, H);
  // 水背景
  ctx.fillStyle = 'rgba(59,130,246,0.08)';
  ctx.fillRect(area, area, W - area * 2, H - area * 2);
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
  ctx.strokeRect(area, area, W - area * 2, H - area * 2);
  const ps = e.particles;
  ps.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < area + 12 || p.x > W - area - 12) p.vx *= -1;
    if (p.y < area + 12 || p.y > H - area - 12) p.vy *= -1;
  });
  // 电离与结合（平衡双向）
  ps.forEach(p => {
    if (p.kind === 'ha' && Math.random() < e.pIon * e.dilute) {
      p.kind = 'ac';
      ps.push({ kind: 'h', x: p.x + 18 + Math.random() * 10, y: p.y - 10 + Math.random() * 20, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5 });
    }
  });
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    if (p.kind !== 'ac') continue;
    // 找最近的 H⁺
    for (let j = 0; j < ps.length; j++) {
      const q = ps[j];
      if (q.kind !== 'h') continue;
      const dx = q.x - p.x, dy = q.y - p.y;
      if (dx * dx + dy * dy < 24 * 24 && Math.random() < e.pAssoc * e.dilute) {
        p.kind = 'ha'; ps.splice(j, 1); break;
      }
    }
  }
  // 绘制
  ps.forEach(p => {
    if (p.kind === 'ha') {
      // CH₃COOH：黄双球
      ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#f6ad55'; ctx.fill();
      ctx.beginPath(); ctx.arc(p.x + 15, p.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#fc8181'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(p.x + 8, p.y); ctx.lineTo(p.x + 13, p.y); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('HA', p.x, p.y);
    } else if (p.kind === 'ac') {
      ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#fc8181'; ctx.fill();
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Ac⁻', p.x, p.y);
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#e2e8f0'; ctx.fill();
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 7px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('H⁺', p.x, p.y + 1);
    }
  });
  // 统计
  let ha = 0, ac = 0, hh = 0;
  ps.forEach(p => { if (p.kind === 'ha') ha++; else if (p.kind === 'ac') ac++; else hh++; });
  const alpha = (ha + ac) > 0 ? ac / (ha + ac) : 0;
  const aEl = document.getElementById('elyAlpha'); if (aEl) aEl.textContent = (alpha * 100).toFixed(1) + '%';
  const haEl = document.getElementById('elyHA'); if (haEl) haEl.textContent = ha;
  const acEl = document.getElementById('elyAc'); if (acEl) acEl.textContent = ac;
  const hEl = document.getElementById('elyH'); if (hEl) hEl.textContent = hh;
}
function elyAdd(kind) {
  if (!electrolyte) return;
  const e = electrolyte;
  const count = kind === 'HA' ? 3 : 2;
  for (let i = 0; i < count; i++) {
    const k = kind === 'HA' ? 'ha' : 'h';
    e.particles.push({ kind: k, x: 40 + Math.random() * 520, y: 40 + Math.random() * 260, vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5 });
  }
}
function elyDilute() {
  if (!electrolyte) return;
  electrolyte.dilute = Math.min(2.2, electrolyte.dilute + 0.3);
  electrolyte.pIon *= 1.25;
}
function elyReset() { initElectrolyteAnim(); }

function stepGalvanic() {

  g.saltIons.forEach(ion => {
    ion.x += ion.charge > 0 ? 0.7 : -0.7;
    if (ion.x < 276) { ion.x = 276; }
    if (ion.x > 424) { ion.x = 424; }
    ion.y = 108 + Math.sqrt(80 * 80 - (ion.x - 350) * (ion.x - 350)) * 0.6;
    ctx.beginPath(); ctx.arc(ion.x, ion.y, 4, 0, Math.PI * 2);

  ctx.fillStyle = '#1e293b'; ctx.fill(); ctx.strokeStyle = '#4fd1c5'; ctx.stroke();
  const swing = Math.sin(t / 10) * 0.8;

  ctx.beginPath(); ctx.moveTo(350, 40); ctx.lineTo(350 + 12 * swing, 40 + 10 * Math.abs(swing) - 10); ctx.stroke();

    ion.x += ion.vx; ion.y += ion.vy;

  ctx.fillStyle = '#f6ad55'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('e⁻ 流向 →', 350, 25);
  ctx.fillStyle = '#4fd1c5';
  ctx.fillText('电流方向 ←', 350, 96);

// ========== 5. 电解池 ==========
let electrolysis = null;
function initElectrolysisAnim() {
  const canvas = document.getElementById('electrolysisCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  electrolysis = {
    canvas, ctx, on: true, count: 0, bubbles: [], deposits: 0, ions: [], tick: 0
  };
  for (let i = 0; i < 16; i++) {
    electrolysis.ions.push({
      x: 130 + Math.random() * 440, y: 160 + Math.random() * 140,

      charge: Math.random() < 0.5 ? 1 : -1
    });
  }
  PrincipleState.anims.electrolysis = { step: stepElectrolysis };
}
function stepElectrolysis() {
  const e = electrolysis;
  const cv = e.canvas, ctx = e.ctx;
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const t = e.tick++;
  // 电源（顶部）
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(80, 50); ctx.lineTo(80, 80); ctx.moveTo(620, 50); ctx.lineTo(620, 80); ctx.stroke();
  // 电池
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(330, 36, 40, 44);
  ctx.fillStyle = '#4fd1c5'; ctx.fillRect(330, 36, 20, 44);
  ctx.fillStyle = '#fc8181'; ctx.fillRect(350, 36, 20, 44);
  ctx.fillStyle = '#0f172a'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('—', 340, 66); ctx.fillText('+', 360, 66);
  // 电解槽
  ctx.fillStyle = 'rgba(59,130,246,0.15)';
  ctx.fillRect(100, 110, 500, 200);
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
  ctx.strokeRect(100, 110, 500, 200);
  // 电极（石墨黑棒）：阳极左（+）、阴极右（−）
  ctx.fillStyle = '#1f2937';
  ctx.fillRect(210, 70, 14, 180);   // 阳极
  ctx.fillRect(476, 70, 14, 180);   // 阴极
  ctx.fillStyle = '#0f172a'; ctx.font = 'bold 11px sans-serif';
  ctx.fillText('阳极 +', 217, 60);
  ctx.fillText('阴极 −', 483, 60);
  // 导线（电极 → 电源）
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(217, 80); ctx.lineTo(350, 80);
  ctx.moveTo(483, 80); ctx.lineTo(350, 80);
  ctx.stroke();
  // 电子运动（外电路）：电源负极 → 阴极；阳极 → 电源正极
  if (e.on) {
    const ex1 = 340 - t % 90 * 0.6, ex2 = 360 + t % 90 * 0.6;
    ctx.beginPath(); ctx.arc(ex1, 80, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#f6ad55'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex2, 80, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#f6ad55'; ctx.fill();
  }
  // 离子移动：Cl⁻（绿）→ 阳极（左）、Cu²⁺（蓝）→ 阴极（右）
  e.ions.forEach(ion => {
    if (e.on) {
      if (ion.charge < 0) ion.x -= 0.6;    // Cl⁻ 向阳极（左）
      else ion.x += 0.5;                   // Cu²⁺ 向阴极（右）
    } else {
      ion.x += ion.vx; ion.y += ion.vy;
      if (ion.x < 120 || ion.x > 580) ion.vx *= -1;
      if (ion.y < 130 || ion.y > 290) ion.vy *= -1;
    }
    if (ion.x < 212) ion.x = 212; if (ion.x > 478) ion.x = 478;
    ctx.beginPath(); ctx.arc(ion.x, ion.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = ion.charge < 0 ? '#68d391' : '#63b3ed';
    ctx.fill();
    // 到达电极：Cl⁻ 放电冒泡 / Cu²⁺ 沉积
    if (e.on && Math.random() < 0.006) {
      if (ion.charge < 0 && ion.x <= 215) {
        e.bubbles.push({ x: 214, y: ion.y, vy: -1.6 });
        e.count++;
        e.ions.splice(e.ions.indexOf(ion), 1);
      } else if (ion.charge > 0 && ion.x >= 477) {
        e.deposits += 1;
        e.count++;
        e.ions.splice(e.ions.indexOf(ion), 1);
      }
    }
  });
  // 气泡上升
  e.bubbles.forEach(b => { b.y += b.vy; });
  e.bubbles = e.bubbles.filter(b => b.y > 110);
  e.bubbles.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
    ctx.strokeStyle = '#68d391'; ctx.lineWidth = 1.5; ctx.stroke();
  });
  // 铜沉积（阴极底部红色）
  const depH = Math.min(70, e.deposits * 2);
  ctx.fillStyle = '#c53030';
  ctx.fillRect(476, 290 - depH, 14, depH);
  // 溶液标签
  ctx.fillStyle = 'rgba(226,232,240,0.6)'; ctx.font = '12px sans-serif';
  ctx.fillText('CuCl₂ 溶液', 330, 130);
  ctx.fillStyle = '#68d391'; ctx.font = '10px sans-serif';
  ctx.fillText('Cl⁻ → 阳极（氧化放氯气）', 130, 300);
  ctx.fillStyle = '#63b3ed';
  ctx.fillText('Cu²⁺ → 阴极（还原析铜）', 430, 300);
  // 电子计数
  const ec = document.getElementById('elysisCount'); if (ec) ec.textContent = e.count;
}
function toggleElectrolysis() {
  if (!electrolysis) return;
  electrolysis.on = !electrolysis.on;
  const btn = document.getElementById('elysisBtn');
  if (btn) btn.textContent = electrolysis.on ? '断开电源' : '接通电源';
}

        <div>
          <div class="tip-box" style="margin:0;"><strong>判断步骤</strong>
            <br>① 碳必须 <b>sp³ 杂化</b>（四个单键）

  if (subId === 'org-exp') return `

          <br>· 用 NaOH 溶液除 SO₂/CO₂ 杂质（品红验证）

        <div class="tip-box" style="margin:0;"><strong>乙酸乙酯的合成</strong>：浓硫酸催化

    </div>

// 视图模式
let skeletal = null;
function initSkeletal() {
  const svg = document.getElementById('skelCanvas');
  if (!svg) return;
  skeletal = {
    svg, ns: 'http://www.w3.org/2000/svg',
    pieces: [], bonds: [], selected: null, view: 'full', // full 结构式 / line 键线式
    placing: null, drag: null
  };
  // 渲染素材库
  const pal = document.getElementById('skelPalette');
  if (pal) {
    pal.innerHTML = '';
    const groups = [
      ['烷基与链', ['methyl','ethyl','CH2','CH','double','triple']],
      ['官能团', ['OH','CHO','COOH','COO','ketone','NH2','NO2','Cl','Br']],
      ['环', ['benzene','cyclohex','cyclopro']]
    ];
    groups.forEach(g => {
      const sec = document.createElement('div');
      sec.className = 'skel-sec';
      sec.innerHTML = '<div class="skel-sec-title">' + g[0] + '</div>';
      g[1].forEach(k => {
        const btn = document.createElement('button');
        btn.className = 'skel-piece-btn';
        btn.innerHTML = '<span class="skel-pv">' + skelPiecePreview(k) + '</span><span>' + SKEL_PIECES[k].name + '</span>';
        btn.onclick = () => { skeletal.placing = k; };
        sec.appendChild(btn);
      });
      pal.appendChild(sec);
    });
  }
  // 渲染预设分子
  const pre = document.getElementById('skelPresets');
  if (pre) {
    pre.innerHTML = '';
    Object.keys(SKEL_PRESETS).forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'skel-preset-btn';
      btn.textContent = name;
      btn.onclick = () => skelAddPreset(name);
      pre.appendChild(btn);
    });
  }
  renderSkeletal();
}
function skelPiecePreview(type) {
  const p = SKEL_PIECES[type];
  let svg = '';
  const atoms = skelRingAtoms(p);
  const bonds = skelRingBonds(p);
  // 简版：只画原子符号与键
  bonds.forEach(b => {
    const a = atoms[b[0]], c = atoms[b[1]];
    svg += '<line x1="' + (a.x/2) + '" y1="' + (a.y/2) + '" x2="' + (c.x/2) + '" y2="' + (c.y/2) + '" stroke="#333" stroke-width="1.4" stroke-dasharray="' + (b[2]>=2?'2,1.2':'none') + '"/>';
  });
  if (p.ring && p.ring.aromatic) svg += '<circle cx="0" cy="0" r="' + (p.ring.r*0.62) + '" fill="none" stroke="#333" stroke-width="1.2"/>';
  atoms.forEach(a => {
    if (a.el === 'C') return;
    svg += '<text x="' + (a.x/2) + '" y="' + (a.y/2 + 4) + '" font-size="11" text-anchor="middle" fill="#0f172a" font-weight="700">' + a.el + '</text>';
  });
  return svg;
}
function skelRingAtoms(p) {
  if (!p.ring) return p.atoms;
  const arr = [];
  for (let i = 0; i < p.ring.n; i++) {
    const ang = Math.PI / 6 + i * 2 * Math.PI / p.ring.n;
    arr.push({ el: 'C', x: Math.cos(ang) * p.ring.r, y: Math.sin(ang) * p.ring.r });
  }
  return arr;
}
function skelRingBonds(p) {
  if (!p.ring) return p.bonds;
  const arr = [];
  for (let i = 0; i < p.ring.n; i++) {
    arr.push([i, (i + 1) % p.ring.n, 1]);
  }
  return arr;
}
function skelRingPorts(p) {
  if (!p.ring) return p.ports;
  // 端口默认在顶点 0（上方）向外
  const i0 = 0;
  const ang = Math.PI / 6;
  const px = Math.cos(ang) * p.ring.r, py = Math.sin(ang) * p.ring.r;
  return [{ x: px, y: py, dx: Math.cos(ang) / 1, dy: Math.sin(ang) / 1 }];
}
function skelAddPreset(name) {
  const preset = SKEL_PRESETS[name];
  if (!preset) return;
  // 找到画布中心偏移，避免重叠
  const used = skeletal.pieces.length * 0;
  const ox = 60 + (used % 3) * 40, oy = 60 + Math.floor(used / 3) * 40;
  const pieceIds = [];
  preset.pieces.forEach(pp => {
    const id = 's' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    skeletal.pieces.push({ id, type: pp[0], x: pp[1].x + ox, y: pp[1].y + oy, rot: pp[1].rot || 0 });
    pieceIds.push(id);
  });
  preset.bonds.forEach(b => {
    skelAddBond(pieceIds[b[0]], b[1], pieceIds[b[2]], b[3]);
  });
  renderSkeletal();
}
function skelAddBond(pieceA, portA, pieceB, portB) {
  // 去重
  const dup = skeletal.bonds.find(bd =>
    (bd.a === pieceA && bd.ap === portA && bd.b === pieceB && bd.bp === portB) ||
    (bd.a === pieceB && bd.ap === portB && bd.b === pieceA && bd.bp === portA));
  if (dup) return;
  skeletal.bonds.push({ a: pieceA, ap: portA, b: pieceB, bp: portB });
}
// 端口全局坐标
function skelPortGlobal(piece, portIdx) {
  const p = SKEL_PIECES[piece.type];
  const ports = skelRingPorts(p);
  const pt = ports[portIdx];
  const ang = piece.rot * Math.PI / 180;
  const cos = Math.cos(ang), sin = Math.sin(ang);
  return { x: piece.x + pt.x * cos - pt.y * sin, y: piece.y + pt.x * sin + pt.y * cos };
}
// 原子全局坐标
function skelAtomGlobal(piece, atomIdx) {
  const p = SKEL_PIECES[piece.type];
  const atoms = skelRingAtoms(p);
  const a = atoms[atomIdx];
  const ang = piece.rot * Math.PI / 180;
  const cos = Math.cos(ang), sin = Math.sin(ang);
  return { x: piece.x + a.x * cos - a.y * sin, y: piece.y + a.x * sin + a.y * cos, el: a.el };
}
// 片段的"主干原子"（用于补氢与结构式绘制）——环取顶点
function skelPieceMainAtoms(piece) {
  const p = SKEL_PIECES[piece.type];
  const atoms = skelRingAtoms(p);
  return atoms.map((a, i) => ({ el: a.el, x: piece.x + rotX(piece, a.x, a.y), y: piece.y + rotY(piece, a.x, a.y), idx: i }));
}
function rotX(piece, x, y) { const a = piece.rot * Math.PI / 180; return x * Math.cos(a) - y * Math.sin(a); }
function rotY(piece, x, y) { const a = piece.rot * Math.PI / 180; return x * Math.sin(a) + y * Math.cos(a); }
// 某原子连接到的键（原子内键 + 跨片段端口键）
function skelAtomBonds(piece, atomIdx, excludePort) {
  const p = SKEL_PIECES[piece.type];
  const res = [];
  const atoms = skelRingAtoms(p);
  const bonds = skelRingBonds(p);
  bonds.forEach(b => {
    if (b[0] === atomIdx) res.push({ dx: atoms[b[1]].x - atoms[b[0]].x, dy: atoms[b[1]].y - atoms[b[0]].y, order: b[2] });
    if (b[1] === atomIdx) res.push({ dx: atoms[b[0]].x - atoms[b[1]].x, dy: atoms[b[0]].y - atoms[b[1]].y, order: b[2] });
  });
  // 端口键：端口对应原子=最近的原子？简化：端口与原点的原子映射——端口位置即键洞，最近原子按端口方向搜索
  // 此处通过全局坐标找：跨片段键把端口另一端的原子作为连接方向
  const ports = skelRingPorts(p);
  ports.forEach((pt, pi) => {
    if (pi === excludePort) return;
    const connected = skeletal.bonds.find(bd =>
      (bd.a === piece.id && bd.ap === pi) || (bd.b === piece.id && bd.bp === pi));
    if (connected) {
      const otherId = connected.a === piece.id ? connected.b : connected.a;
      const otherPort = connected.a === piece.id ? connected.bp : connected.ap;
      const other = skeletal.pieces.find(pp => pp.id === otherId);
      if (other) {
        const pg = skelPortGlobal(piece, pi);
        const og = skelPortGlobal(other, otherPort);
        // 从端口位置指向另一端原子（该片段在端口方向上的第一个原子）
        const oa = skelNearestAtomToPort(other, otherPort);
        res.push({ dx: (oa.x - pg.x), dy: (oa.y - pg.y), order: 1, fromPort: pi });
      }
    }
  });
  return res;
}
function skelNearestAtomToPort(piece, portIdx) {
  const atoms = skelPieceMainAtoms(piece);
  const pg = skelPortGlobal(piece, portIdx);
  let best = atoms[0], bd = 1e9;
  atoms.forEach(a => { const d = (a.x - pg.x) ** 2 + (a.y - pg.y) ** 2; if (d < bd) { bd = d; best = a; } });
  return best;
}
// 补氢数：碳四价
function skelHCount(piece, atomIdx) {
  const p = SKEL_PIECES[piece.type];
  const atoms = skelRingAtoms(p);
  const a = atoms[atomIdx];
  if (a.el === 'C') {
    let used = 0;
    const bonds = skelRingBonds(p);
    bonds.forEach(b => {
      if (b[0] === atomIdx) used += b[2];
      if (b[1] === atomIdx) used += b[2];
    });
    // 端口键（该原子为端口所在原子时）
    const ports = skelRingPorts(p);
    ports.forEach((pt, pi) => {
      const connected = skeletal.bonds.find(bd => (bd.a === piece.id && bd.ap === pi) || (bd.b === piece.id && bd.bp === pi));
      if (connected) {
        const pg = skelPortGlobal(piece, pi);
        const atomsLocal = skelPieceMainAtoms(piece);
        const d = (atomsLocal[atomIdx].x - pg.x) ** 2 + (atomsLocal[atomIdx].y - pg.y) ** 2;
        if (d < (SKEL_L * 0.75) ** 2) used += 1;
      }
    });
    return Math.max(0, 4 - used);
  }
  if (a.el === 'O') return 1; // 简化：氧默认补 1 个 H（-OH）
  if (a.el === 'N') return 1; // 简化：氨基氮补 2，其他补 1——按键数算
  return 0;
}
// ---------- 渲染 ----------
function renderSkeletal() {
  const sk = skeletal; if (!sk) return;
  const svg = sk.svg;
  // 清空（保留事件层由 svg 自带）
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  // 网格背景
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('x', 0); bg.setAttribute('y', 0);
  bg.setAttribute('width', svg.clientWidth || 820); bg.setAttribute('height', svg.clientHeight || 560);
  bg.setAttribute('fill', '#ffffff'); bg.setAttribute('rx', 10);
  svg.appendChild(bg);
  // 画跨片段端口键（底层）
  sk.bonds.forEach(bd => {
    const pa = sk.pieces.find(pp => pp.id === bd.a);
    const pb = sk.pieces.find(pp => pp.id === bd.b);
    if (!pa || !pb) return;
    const p1 = skelPortGlobal(pa, bd.ap);
    const p2 = skelPortGlobal(pb, bd.bp);
    skelDrawBond(svg, p1.x, p1.y, p2.x, p2.y, 1, '#1e293b');
  });
  // 画片段
  sk.pieces.forEach(piece => {
    skelDrawPiece(svg, piece, sk.view === 'line');
  });
  // 端口提示点（常显淡色帮助拼接）
  sk.pieces.forEach(piece => {
    const p = SKEL_PIECES[piece.type];
    const ports = skelRingPorts(p);
    ports.forEach((pt, pi) => {
      const pg = skelPortGlobal(piece, pi);
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', pg.x); c.setAttribute('cy', pg.y); c.setAttribute('r', 3.5);
      c.setAttribute('fill', '#4fd1c5'); c.setAttribute('opacity', 0.35);
      c.setAttribute('class', 'skel-port');
      svg.appendChild(c);
    });
  });
  // 选中高亮
  if (sk.selected) {
    const pc = sk.pieces.find(pp => pp.id === sk.selected);
    if (pc) {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', pc.x - 60); r.setAttribute('y', pc.y - 60);
      r.setAttribute('width', 120); r.setAttribute('height', 120);
      r.setAttribute('fill', 'none'); r.setAttribute('stroke', '#fbbf24'); r.setAttribute('stroke-width', 2);
      r.setAttribute('stroke-dasharray', '6,4'); r.setAttribute('rx', 8);
      svg.appendChild(r);
    }
  }
  updateSkelFormula();
}
function skelDrawBond(svg, x1, y1, x2, y2, order, color) {
  const ns = svg.namespaceURI || 'http://www.w3.org/2000/svg';
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const off = 3.4;
  const draw = (ox, oy) => {
    const l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', x1 + ox); l.setAttribute('y1', y1 + oy);
    l.setAttribute('x2', x2 + ox); l.setAttribute('y2', y2 + oy);
    l.setAttribute('stroke', color); l.setAttribute('stroke-width', 2.1);
    l.setAttribute('stroke-linecap', 'round');
    svg.appendChild(l);
  };
  if (order === 1) draw(0, 0);
  else if (order === 2) { draw(-off * nx, -off * ny); draw(off * nx, off * ny); }
  else if (order === 3) { draw(0, 0); draw(-off * nx, -off * ny); draw(off * nx, off * ny); }
}
function skelDrawPiece(svg, piece, lineMode) {
  const p = SKEL_PIECES[piece.type];
  const atoms = skelRingAtoms(p);
  const bonds = skelRingBonds(p);
  // 片段内键（全局坐标）
  bonds.forEach(b => {
    const a = skelAtomGlobal(piece, b[0]), c = skelAtomGlobal(piece, b[1]);
    if (lineMode && b[2] >= 2) {
      skelDrawBond(svg, a.x, a.y, c.x, c.y, 2, '#1e293b');
    } else if (lineMode) {
      skelDrawBond(svg, a.x, a.y, c.x, c.y, 1, '#1e293b');
    } else {
      skelDrawBond(svg, a.x, a.y, c.x, c.y, b[2], '#1e293b');
    }
  });
  // 苯环内圆（大π键 Π₆⁶）
  if (p.ring && p.ring.aromatic) {
    const cx = piece.x, cy = piece.y;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy);
    c.setAttribute('r', p.ring.r * 0.62);
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', '#1e293b'); c.setAttribute('stroke-width', 1.6);
    svg.appendChild(c);
  }
  // 原子符号 + 补氢（结构式视图）
  if (!lineMode) {
    atoms.forEach((a, ai) => {
      const g = skelAtomGlobal(piece, ai);
      const isPortAtom = skelIsPortAtom(piece, ai);
      // 该原子是否已被跨片段键占用方向（端口方向被占用则不算自由键）
      const bonded = skelAtomConnected(piece, ai);
      if (a.el === 'C') {
        // 环顶点碳或链碳：显示 C
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', g.x); t.setAttribute('y', g.y + 5);
        t.setAttribute('font-size', 15); t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-weight', 700); t.setAttribute('fill', '#0f172a');
        t.textContent = 'C';
        svg.appendChild(t);
        // 补 H
        const hc = skelHCount(piece, ai);
        skelDrawH(svg, piece, ai, hc);
      } else {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', g.x); t.setAttribute('y', g.y + 5);
        t.setAttribute('font-size', 15); t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-weight', 700);
        t.setAttribute('fill', a.el === 'O' ? '#dc2626' : a.el === 'N' ? '#2563eb' : a.el === 'Cl' || a.el === 'Br' ? '#15803d' : '#0f172a');
        t.textContent = a.el;
        svg.appendChild(t);
        // 杂原子补 H（-OH 的 H）
        const hc = skelHCount(piece, ai);
        if (hc > 0) skelDrawH(svg, piece, ai, hc);
      }
    });
  } else {
    // 键线式：只画杂原子符号
    atoms.forEach((a, ai) => {
      if (a.el === 'C') return;
      const g = skelAtomGlobal(piece, ai);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', g.x); t.setAttribute('y', g.y + 5);
      t.setAttribute('font-size', 15); t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-weight', 700);
      t.setAttribute('fill', a.el === 'O' ? '#dc2626' : a.el === 'N' ? '#2563eb' : a.el === 'Cl' || a.el === 'Br' ? '#15803d' : '#0f172a');
      t.textContent = a.el;
      svg.appendChild(t);
    });
  }
}
function skelIsPortAtom(piece, atomIdx) {
  const p = SKEL_PIECES[piece.type];
  const ports = skelRingPorts(p);
  const atoms = skelRingAtoms(p);
  const a = atoms[atomIdx];
  return ports.some(pt => (a.x - pt.x) ** 2 + (a.y - pt.y) ** 2 < (SKEL_L * 0.6) ** 2);
}
function skelAtomConnected(piece, atomIdx) {
  // 端口方向是否有跨片段键
  const p = SKEL_PIECES[piece.type];
  const ports = skelRingPorts(p);
  const atoms = skelRingAtoms(p);
  const a = atoms[atomIdx];
  let connected = false;
  ports.forEach((pt, pi) => {
    if ((a.x - pt.x) ** 2 + (a.y - pt.y) ** 2 > (SKEL_L * 0.6) ** 2) return;
    const c = skeletal.bonds.find(bd => (bd.a === piece.id && bd.ap === pi) || (bd.b === piece.id && bd.bp === pi));
    if (c) connected = true;
  });
  return connected;
}
function skelDrawH(svg, piece, atomIdx, hCount) {
  if (hCount <= 0) return;
  const atoms = skelRingAtoms(piece.type ? SKEL_PIECES[piece.type] : SKEL_PIECES[piece.type]);
  const g = skelAtomGlobal(piece, atomIdx);
  const p = SKEL_PIECES[piece.type];
  const ringA = skelRingAtoms(p);
  const bonds = skelRingBonds(p);
  // 已占用的方向（原子间键 + 端口键）
  const dirs = [];
  bonds.forEach(b => {
    if (b[0] === atomIdx) { const o = ringA[b[1]]; dirs.push({ x: o.x - ringA[atomIdx].x, y: o.y - ringA[atomIdx].y }); }
    if (b[1] === atomIdx) { const o = ringA[b[0]]; dirs.push({ x: o.x - ringA[atomIdx].x, y: o.y - ringA[atomIdx].y }); }
  });
  // 端口键方向
  const ports = skelRingPorts(p);
  ports.forEach((pt, pi) => {
    if ((ringA[atomIdx].x - pt.x) ** 2 + (ringA[atomIdx].y - pt.y) ** 2 > (SKEL_L * 0.6) ** 2) return;
    const c = skeletal.bonds.find(bd => (bd.a === piece.id && bd.ap === pi) || (bd.b === piece.id && bd.bp === pi));
    if (c) dirs.push({ x: -pt.dx, y: -pt.dy });
  });
  // 求剩余方向：中心 = 各占用方向的反向之和
  let sx = 0, sy = 0;
  dirs.forEach(d => { sx -= d.x; sy -= d.y; });
  const dl = Math.sqrt(sx * sx + sy * sy) || 1;
  let baseAng = Math.atan2(sy / dl, sx / dl);
  if (hCount === 1) {
    // 一个 H：放在剩余方向的中间
    skelPutH(svg, g.x, g.y, baseAng, 0);
  } else {
    // 多个 H：围绕 baseAng 对称分布
    for (let i = 0; i < hCount; i++) {
      const span = Math.PI * 0.62;
      const off = (i - (hCount - 1) / 2) * span / Math.max(1, hCount - 1);
      skelPutH(svg, g.x, g.y, baseAng, off);
    }
  }
}
function skelPutH(svg, x, y, baseAng, off) {
  const ang = baseAng + off;
  const hx = x + Math.cos(ang) * SKEL_L * 0.62;
  const hy = y + Math.sin(ang) * SKEL_L * 0.62;
  skelDrawBond(svg, x, y, hx, hy, 1, '#475569');
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', hx); t.setAttribute('y', hy + 4.5);
  t.setAttribute('font-size', 13); t.setAttribute('text-anchor', 'middle');
  t.setAttribute('fill', '#475569'); t.setAttribute('font-weight', 600);
  t.textContent = 'H';
  svg.appendChild(t);
}
// ---------- 交互 ----------
function skelSvgPos(evt) {
  const svg = skeletal.svg;
  const rect = svg.getBoundingClientRect();
  const scaleX = svg.clientWidth ? (svg.viewBox ? svg.viewBox.baseVal.width : svg.clientWidth) / rect.width : 1;
  const scaleY = svg.clientHeight ? (svg.viewBox ? svg.viewBox.baseVal.height : svg.clientHeight) / rect.height : 1;
  return { x: (evt.clientX - rect.left) * scaleX, y: (evt.clientY - rect.top) * scaleY };
}
function skelOnDown(evt) {
  const pos = skelSvgPos(evt);
  // 若处于放置模式：放一个片段
  if (skeletal.placing) {
    const id = 's' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    skeletal.pieces.push({ id, type: skeletal.placing, x: pos.x, y: pos.y, rot: 0 });
    skeletal.placing = null;
    // 尝试吸附
    skelSnap(id);
    skeletal.selected = id;
    renderSkeletal();
    return;
  }
  // 命中检测：从上层往下找最近的片段原子
  let hit = null, best = 1e9;
  skeletal.pieces.forEach(piece => {
    const atoms = skelPieceMainAtoms(piece);
    atoms.forEach(a => {
      const d = (a.x - pos.x) ** 2 + (a.y - pos.y) ** 2;
      if (d < 30 * 30 && d < best) { best = d; hit = piece; }
    });
  });
  if (hit) {
    skeletal.selected = hit.id;
    skeletal.drag = { id: hit.id, dx: pos.x - hit.x, dy: pos.y - hit.y };
    renderSkeletal();
  } else {
    skeletal.selected = null;
    renderSkeletal();
  }
}
function skelOnMove(evt) {
  if (!skeletal.drag) return;
  const pos = skelSvgPos(evt);
  const pc = skeletal.pieces.find(pp => pp.id === skeletal.drag.id);
  if (!pc) return;
  pc.x = pos.x - skeletal.drag.dx;
  pc.y = pos.y - skeletal.drag.dy;
  // 拖动中实时吸附
  skelSnap(pc.id);
  renderSkeletal();
}
function skelOnUp() { skeletal.drag = null; }
function skelSnap(dragId) {
  const dragPiece = skeletal.pieces.find(pp => pp.id === dragId);
  if (!dragPiece) return;
  const dp = SKEL_PIECES[dragPiece.type];
  const dPorts = skelRingPorts(dp);
  let changed = false;
  dPorts.forEach((pt, pi) => {
    const dg = skelPortGlobal(dragPiece, pi);
    skeletal.pieces.forEach(other => {
      if (other.id === dragId) return;
      const op = SKEL_PIECES[other.type];
      const oPorts = skelRingPorts(op);
      oPorts.forEach((opt, oi) => {
        const og = skelPortGlobal(other, oi);
        const d = (dg.x - og.x) ** 2 + (dg.y - og.y) ** 2;
        if (d < 22 * 22) {
          // 对齐：把 dragPiece 平移使端口重合
          dragPiece.x += og.x - dg.x;
          dragPiece.y += og.y - dg.y;
          skelAddBond(dragPiece.id, pi, other.id, oi);
          changed = true;
        }
      });
    });
  });
  if (changed) renderSkeletal();
}
function skelRotateSel() {
  const pc = skeletal.pieces.find(pp => pp.id === skeletal.selected);
  if (!pc) return;
  pc.rot = (pc.rot + 90) % 360;
  // 旋转后重新吸附
  skelSnap(pc.id);
  renderSkeletal();
}
function skelDeleteSel() {
  if (!skeletal.selected) return;
  skeletal.pieces = skeletal.pieces.filter(pp => pp.id !== skeletal.selected);
  skeletal.bonds = skeletal.bonds.filter(bd => bd.a !== skeletal.selected && bd.b !== skeletal.selected);
  skeletal.selected = null;
  renderSkeletal();
}
function skelClear() {
  if (skeletal) { skeletal.pieces = []; skeletal.bonds = []; skeletal.selected = null; renderSkeletal(); }
}
function skelSetView(v) {
  if (!skeletal) return;
  skeletal.view = v;
  const btns = document.querySelectorAll('.skel-view-btn');
  btns.forEach(b => b.classList.toggle('active', b.dataset.v === v));
  renderSkeletal();
}
function skelFormulaText() {
  // 构建连通图
  const links = {};
  skeletal.bonds.forEach(bd => {
    (links[bd.a] = links[bd.a] || []).push({ to: bd.b, port: bd.ap, oPort: bd.bp });
    (links[bd.b] = links[bd.b] || []).push({ to: bd.a, port: bd.bp, oPort: bd.ap });
  });
  const deg = {};
  Object.keys(links).forEach(k => deg[k] = links[k].length);
  const all = skeletal.pieces.slice();
  // 按连通分量分组
  const visited = new Set();
  const comps = [];
  all.forEach(pp => {
    if (visited.has(pp.id)) return;
    const comp = [];
    const queue = [pp.id];
    visited.add(pp.id);
    while (queue.length) {
      const id = queue.shift();
      comp.push(id);
      (links[id] || []).forEach(l => { if (!visited.has(l.to)) { visited.add(l.to); queue.push(l.to); } });
    }
    comps.push(comp);
  });
  // 每个分量：从度<=1 的片段开始 DFS
  const parts = comps.map(comp => {
    const starts = comp.filter(id => (deg[id] || 0) <= 1);
    const names = [];
    const seen = new Set();
    const dfs = (id) => {
      seen.add(id);
      const pc = skeletal.pieces.find(pp => pp.id === id);
      names.push(SKEL_TEXT_NAME[pc.type] || pc.type);
      (links[id] || []).forEach(l => { if (!seen.has(l.to)) dfs(l.to); });
    };
    if (starts.length) dfs(starts[0]);
    else dfs(comp[0]);
    // 分量内分支：其余作为括号挂接
    const rest = comp.filter(id => !seen.has(id));
    rest.forEach(u => { names.push('(' + (SKEL_TEXT_NAME[skeletal.pieces.find(pp => pp.id === u).type] || '') + ')'); });
    return names.join('');
  });
  return parts.join('  ');
}
function updateSkelFormula() {
  const el = document.getElementById('skelFormula');
  if (!el) return;
  if (skeletal.pieces.length === 0) { el.textContent = '（空画布）'; return; }
  el.textContent = skelFormulaText();
}
function skelExport() {
  const svg = skeletal.svg;
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', svg.clientWidth || 820);
  clone.setAttribute('height', svg.clientHeight || 560);
  const str = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([str], { type: 'image/svg+xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '有机结构简式.svg';
  a.click();
  URL.revokeObjectURL(a.href);
}

// 清理所有 Three.js 场景
function cleanupThreeScenes() {
  Object.keys(AppState.threeScenes).forEach(key => {
    const scene = AppState.threeScenes[key];
    if (scene) {
      if (scene.animationId) cancelAnimationFrame(scene.animationId);
      if (scene.renderer) {
        scene.renderer.dispose();
        if (scene.renderer.domElement && scene.renderer.domElement.parentNode) {
          scene.renderer.domElement.parentNode.removeChild(scene.renderer.domElement);
        }
      }
    }
    delete AppState.threeScenes[key];
  });
}

// 创建通用 Three.js 场景
function createThreeScene(containerId, opts) {
  const container = document.getElementById(containerId);
  if (!container) return null;
  opts = opts || {};

  const width = container.clientWidth;
  const height = container.clientHeight;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a202c);

  // 正交投影（晶胞用）：无近大远小，正六面体各边比例真实；
  // 透视投影（分子等用）：fov 44 默认
  const isOrtho = !!opts.ortho;
  const frustumSize = opts.frustumSize || 5.5;
  const aspect = width / height;
  let camera;
  if (isOrtho) {
    camera = new THREE.OrthographicCamera(
      -frustumSize * aspect / 2, frustumSize * aspect / 2,
      frustumSize / 2, -frustumSize / 2, 0.1, 1000
    );
  } else {
    camera = new THREE.PerspectiveCamera(44, aspect, 0.1, 1000);
  }
  camera.position.set(...(opts.initialPos || [0, 0, 6]));
  // 初始显示缩放（正交下等价于整体尺度预设；滚轮缩放/重置视角均以此为基准）
  if (opts.zoom) {
    camera.zoom = opts.zoom;
    camera.updateProjectionMatrix();
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;
  // 清理旧 canvas，避免多次重建累积覆盖（视觉错乱根因）
  container.querySelectorAll('canvas').forEach(c => c.remove());
  container.appendChild(renderer.domElement);

  // 光照
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(5, 5, 5);
  scene.add(directionalLight);
  const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
  directionalLight2.position.set(-5, -3, -5);
  scene.add(directionalLight2);

  // 控制器
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // 响应式
  const handleResize = () => {
    const w = container.clientWidth;
    const h = container.clientHeight;
    if (isOrtho) {
      const a = w / h;
      camera.left = -frustumSize * a / 2;
      camera.right = frustumSize * a / 2;
      camera.top = frustumSize / 2;
      camera.bottom = -frustumSize / 2;
    } else {
      camera.aspect = w / h;
    }
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  };
  window.addEventListener('resize', handleResize);

  const sceneObj = { scene, camera, renderer, controls, handleResize, animationId: null, isOrtho, frustumSize };

  // 动画循环
  function animate() {
    sceneObj.animationId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  return sceneObj;
}

// ===== 晶胞 XYZ 坐标轴（带箭头与字母标签） =====
let crystalAxesVisible = false; // 预设晶胞坐标轴开关（默认关闭，等用户确认方案后再启用）

function createAxes3D(group, opts) {
  const o = opts.origin || [0, 0, 0];
  const axes = opts.axes || [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  const L = opts.lengths ? opts.lengths[0] : 1.0; // 统一长度（小号）
  const colors = [0xff5252, 0x43a047, 0x1e88e5]; // X红 / Y绿 / Z蓝（柔和）
  const labels = ['X', 'Y', 'Z'];
  for (let i = 0; i < 3; i++) {
    const d = vNorm(axes[i]); // 方向单位向量（支持任意朝向）
    const tx = o[0] + d[0] * L, ty = o[1] + d[1] * L, tz = o[2] + d[2] * L;
    const dirV = new THREE.Vector3(d[0], d[1], d[2]);
    // 主线：细圆柱杆（比 Line 更精致立体）
    const cyl = new THREE.Mesh(
      new THREE.CylinderGeometry(0.022, 0.022, L, 8),
      new THREE.MeshBasicMaterial({ color: colors[i] })
    );
    cyl.position.set(o[0] + d[0] * L / 2, o[1] + d[1] * L / 2, o[2] + d[2] * L / 2);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirV);
    group.add(cyl);
    // 箭头锥体（小巧）
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(0.055, 0.18, 12),
      new THREE.MeshBasicMaterial({ color: colors[i] })
    );
    cone.position.set(tx, ty, tz);
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirV);
    group.add(cone);
    // 字母标签
    const sp = makeAxesLabel(labels[i], colors[i]);
    sp.position.set(o[0] + d[0] * (L + 0.16), o[1] + d[1] * (L + 0.16), o[2] + d[2] * (L + 0.16));
    group.add(sp);
  }
}

function makeAxesLabel(text, colorHex) {
  const cv = document.createElement('canvas');
  cv.width = 96; cv.height = 96;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 96, 96);
  ctx.font = 'bold 68px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#' + new THREE.Color(colorHex).getHexString();
  ctx.strokeStyle = 'rgba(255,255,255,0.92)';
  ctx.lineWidth = 6;
  ctx.strokeText(text, 48, 50);
  ctx.fillText(text, 48, 50);
  const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthTest: false });
  const sp = new THREE.Sprite(mat);
  sp.scale.set(0.45, 0.45, 0.45);
  return sp;
}

  // 获取当前分子数据
  const molecules = {
    inorganic: ['H₂O', 'NH₃', 'CO₂', 'CH₄'],

    alkene: ['C₂H₄', 'C₂H₂'],
    aromatic: ['C₆H₆'],
    oxygen: ['C₂H₅OH', 'CH₃COOH'],
    amino: ['C₂H₅NO₂'],
    bonding: ['C₂H₄']
  };

  const sub = AppState.currentSubPage || 'inorganic';

  // v0.13：VSEPR 与我的绘制导入分支
  if (sub === 'vsepr') {
    const d = VSEPR_DATA[vseprCurrentName];
    const md = MOLECULE_DATA[vseprCurrentName];
    if (md) buildMolecule(sceneObj.scene, md, currentMoleculeModel);
    const info = document.getElementById('moleculeInfo');

    updateVseprDetails();
    return;
  }
  if (sub === 'mydraw') {
    const md = readDrawMoleculeForViewer();
    const cnt = document.getElementById('drawImportCount');
    const info = document.getElementById('moleculeInfo');
    if (md) {
      buildMolecule(sceneObj.scene, md, currentMoleculeModel);
      if (cnt) cnt.textContent = md.atoms.length + ' 原子 / ' + md.bonds.length + ' 键（已补氢校正）';
    } else {
      buildMolecule(sceneObj.scene, MOLECULE_DATA['CH₄'], currentMoleculeModel);
      if (cnt) cnt.textContent = '画布为空（示例 CH₄）';
    }
    if (info) info.innerHTML = '拖拽旋转 · 滚轮缩放 · 导入自「自由绘图」' + (md ? ' · <b style="color:#4fd1c5">' + md.atoms.length + ' 原子 / ' + md.bonds.length + ' 键</b>' : '');
    return;
  }

  const molList = molecules[sub] || molecules.inorganic;
  const molName = molList[currentMoleculeIndex] || molList[0];
  const molData = MOLECULE_DATA[molName];

  if (molData) {
    buildMolecule(sceneObj.scene, molData, currentMoleculeModel);
    const info = document.getElementById('moleculeInfo');
    if (info) info.textContent = `当前分子：${molName} | 拖拽旋转 · 滚轮缩放`;
  } else {
    // 显示一个简单的占位分子（甲烷）
    buildMolecule(sceneObj.scene, MOLECULE_DATA['CH₄'], currentMoleculeModel);
    const info = document.getElementById('moleculeInfo');
    if (info) info.textContent = `当前分子：CH₄（示例）| ${molName} 模型数据完善中`;
  }
}

function buildMolecule(scene, molData, model) {
  const group = new THREE.Group();
  const isSpaceFill = model === 'spacefill';

  // —— 原子 ——
  molData.atoms.forEach(atom => {
    const props = ATOM_PROPS[atom.element] || { color: 0x888888, radius: 0.4, vdw: 1.7 };
    // 比例模型（空间填充）：按范德华半径缩放，原子球相互接触、不显示键
    // 球棍模型：按共价半径显示小球 + 独立杆件键
    const radius = isSpaceFill ? (props.vdw || props.radius * 3.5) * 0.5 : props.radius;
    const geometry = new THREE.SphereGeometry(radius, isSpaceFill ? 48 : 32, isSpaceFill ? 40 : 32);
    const material = new THREE.MeshPhongMaterial({
      color: props.color,
      shininess: isSpaceFill ? 30 : 80,
      specular: isSpaceFill ? 0x111111 : 0x333333
    });
    const sphere = new THREE.Mesh(geometry, material);
    sphere.position.set(atom.pos[0], atom.pos[1], atom.pos[2]);
    group.add(sphere);
  });

  // —— 键（比例模型不显示键，原子球直接接触）——
  if (!isSpaceFill) {
    molData.bonds.forEach(bond => {
      const [i, j, order] = bond;
      const atom1 = molData.atoms[i];
      const atom2 = molData.atoms[j];
      if (!atom1 || !atom2) return;
      createBond(group, atom1.pos, atom2.pos, order || 1);
    });
  }

  // —— 苯环大π键 Π₆⁶：环中央半透明圆环示意 ——
  if (!isSpaceFill && molData.bonds) {
    const ringBonds = molData.bonds.filter(b => (b[2] || 1) === 1.5);
    if (ringBonds.length >= 5) {
      // 收集成环的碳原子
      const seen = new Set();
      ringBonds.forEach(b => { seen.add(b[0]); seen.add(b[1]); });
      const ringIdx = [...seen];
      // 环心
      let cx = 0, cy = 0, cz = 0;
      ringIdx.forEach(ai => { const p = molData.atoms[ai].pos; cx += p[0]; cy += p[1]; cz += p[2]; });
      const n = ringIdx.length || 6;
      cx /= n; cy /= n; cz /= n;
      // 环法向：相邻两个环向量叉积
      const a0 = molData.atoms[ringIdx[0]].pos;
      const a1 = molData.atoms[ringIdx[1]].pos;
      const a2 = molData.atoms[ringIdx[2]].pos;
      const v1 = [a1[0]-a0[0], a1[1]-a0[1], a1[2]-a0[2]];
      const v2 = [a2[0]-a0[0], a2[1]-a0[1], a2[2]-a0[2]];
      const nv = vNorm(vCross(v1, v2));
      const rr = Math.sqrt((a0[0]-cx)**2 + (a0[1]-cy)**2 + (a0[2]-cz)**2);
      const ringGeo = new THREE.RingGeometry(rr * 0.5, rr * 0.72, 64);
      const ringMat = new THREE.MeshPhongMaterial({
        color: 0x4fd1c5, transparent: true, opacity: 0.42,
        side: THREE.DoubleSide, emissive: 0x1a6b6b, emissiveIntensity: 0.4, depthWrite: false
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.set(cx, cy, cz);
      ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(nv[0], nv[1], nv[2]));
      group.add(ring);
    }
  }

  // 孤对电子（v0.13）：青色半透明电子云（仅球棍模型显示）
  if (molData.lonePairs && moleculeLonePairVisible && !isSpaceFill) {
    molData.lonePairs.forEach(lp => {
      const atom = molData.atoms[lp.atom];
      if (!atom) return;
      const d0 = lp.dir || [0, 1, 0];
      const vd = vNorm(d0);
      // 垂直方向
      let perp = [0, 1, 0];
      if (Math.abs(vd[1]) > 0.9) perp = [1, 0, 0];
      const pv = vCross(vd, perp);
      const pv2 = vNorm(vCross(vd, pv));
      for (let k = 0; k < lp.count; k++) {
        const shift = (k - (lp.count - 1) / 2) * 0.6;
        const cx = atom.pos[0] + vd[0] * 0.8 + pv2[0] * shift;
        const cy = atom.pos[1] + vd[1] * 0.8 + pv2[1] * shift;
        const cz = atom.pos[2] + vd[2] * 0.8 + pv2[2] * shift;
        const eGeo = new THREE.SphereGeometry(0.24, 20, 20);
        const eMat = new THREE.MeshPhongMaterial({
          color: 0x4fd1c5, transparent: true, opacity: 0.6,
          emissive: 0x1a6b6b, emissiveIntensity: 0.5, shininess: 40
        });
        const cloud = new THREE.Mesh(eGeo, eMat);
        cloud.position.set(cx, cy, cz);
        group.add(cloud);
      }
    });
  }

  scene.add(group);
}

function createBond(group, pos1, pos2, order) {
  const p1 = new THREE.Vector3(pos1[0], pos1[1], pos1[2]);
  const p2 = new THREE.Vector3(pos2[0], pos2[1], pos2[2]);
  const direction = new THREE.Vector3().subVectors(p2, p1);
  const length = direction.length() || 0.001;
  const midpoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

  const bondRadius = DrawState.bondRadius || 0.14;
  // 1.5 = 苯环大π键：按单键渲染（大π键圆环由 buildMolecule 补充）
  const effOrder = order === 1.5 ? 1 : (order || 1);
  const offs = effOrder === 1 ? [0] : effOrder === 2 ? [-1, 1] : [-1.7, 0, 1.7];
  const offDist = bondRadius * 2.0; // 多键分开距离随键粗细缩放

  // 计算垂直方向用于偏移多键
  const perp = new THREE.Vector3(0, 1, 0);
  if (Math.abs(direction.y) > 0.9) perp.set(1, 0, 0);
  perp.crossVectors(direction, perp).normalize();

  // 键色区分键级：单键银灰 / 双键浅蓝 / 三键浅橙（便于看 σ/π 键）
  const bondColor = effOrder === 1 ? 0xb8c2cc : (effOrder === 2 ? 0x7fb3e0 : 0xe0a878);

  offs.forEach(off => {
    const geometry = new THREE.CylinderGeometry(bondRadius, bondRadius, length, 16);
    const material = new THREE.MeshPhongMaterial({ color: bondColor, shininess: 60, specular: 0x222222 });
    const cylinder = new THREE.Mesh(geometry, material);

    // 位置偏移
    const offsetVec = perp.clone().multiplyScalar(off * offDist);
    cylinder.position.copy(midpoint).add(offsetVec);

    // 方向
    cylinder.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction.clone().normalize()
    );

    group.add(cylinder);
  });
}

// ===== 晶胞 3D 场景 =====
function initCrystalScene() {
  // 晶胞默认正交投影：无近大远小，严格正六面体；默认沿 a 轴（+x）正对原点
  const sceneObj = createThreeScene('crystalViewer', {
    ortho: !crystalPerspective,
    frustumSize: 5.5,
    initialPos: [7, 0, 0],
    zoom: 0.6
  });
  if (!sceneObj) return;
  AppState.threeScenes.crystal = sceneObj;

  const sub = AppState.currentSubPage || 'nacl';
  buildCrystal(sceneObj.scene, sub);

  const info = document.getElementById('crystalInfo');
  if (info) info.textContent = `晶胞类型：${sub} | 拖拽旋转 · 滚轮缩放`;
}

function buildCrystal(scene, type) {
  const group = new THREE.Group();

  // 晶胞边框
  const edgeGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(3, 3, 3));
  const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x666666, transparent: true, opacity: 0.5 });
  const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
  group.add(edges);

  const a = 1.5; // 半边长

  // 辅助函数：创建原子球
  function makeAtom(x, y, z, color, radius, label) {
    const geometry = new THREE.SphereGeometry(radius, 24, 24);
    // 默认实遮挡（depthTest 开启，后面原子完全被挡）；勾选「透明内部」后半透明
    const material = new THREE.MeshPhongMaterial({
      color, shininess: 60,
      transparent: crystalTransparent,
      opacity: crystalTransparent ? 0.45 : 1,
      depthWrite: !crystalTransparent
    });
    const sphere = new THREE.Mesh(geometry, material);
    sphere.position.set(x, y, z);
    group.add(sphere);

    if (crystalDisplayMode === 'labels' && label) {
      // 标签用小 sprite（简化：用不同颜色小球标注位置类型）
    }
  }

  switch (type) {
    case 'nacl': {
      // NaCl: Cl- 在面心立方位置，Na+ 在八面体空隙
      // 原子半径等大（0.42）：保证从正面看投影重叠处前球完全盖住后球，
      // 不会露出"被重叠"的后层原子，正视图呈现标准 3×3 网格（四角Cl+中心Cl+四边中点Na）
      const clColor = 0x1ff01f, naColor = 0xab5cf2;
      // Cl-: 顶点 + 面心
      [[-a,-a,-a],[a,-a,-a],[-a,a,-a],[-a,-a,a],[a,a,-a],[a,-a,a],[-a,a,a],[a,a,a]].forEach(p => makeAtom(...p, clColor, 0.42));
      [[0,0,-a],[0,0,a],[0,-a,0],[0,a,0],[-a,0,0],[a,0,0]].forEach(p => makeAtom(...p, clColor, 0.42));
      // Na+: 棱心 + 体心
      [[0,-a,-a],[0,a,-a],[0,-a,a],[0,a,a],[-a,0,-a],[a,0,-a],[-a,0,a],[a,0,a],[-a,-a,0],[a,-a,0],[-a,a,0],[a,a,0]].forEach(p => makeAtom(...p, naColor, 0.42));
      makeAtom(0, 0, 0, naColor, 0.42);
      break;
    }
    case 'cscl': {
      // CsCl: Cl- 顶点，Cs+ 体心
      const clColor = 0x1ff01f, csColor = 0x8f40d4;
      [[-a,-a,-a],[a,-a,-a],[-a,a,-a],[-a,-a,a],[a,a,-a],[a,-a,a],[-a,a,a],[a,a,a]].forEach(p => makeAtom(...p, clColor, 0.35));
      makeAtom(0, 0, 0, csColor, 0.4);
      break;
    }
    case 'caf2': {
      // CaF2: Ca2+ 面心立方，F- 在全部四面体空隙
      const caColor = 0x3dff00, fColor = 0x90e050;
      [[-a,-a,-a],[a,-a,-a],[-a,a,-a],[-a,-a,a],[a,a,-a],[a,-a,a],[-a,a,a],[a,a,a]].forEach(p => makeAtom(...p, caColor, 0.35));
      [[0,0,-a],[0,0,a],[0,-a,0],[0,a,0],[-a,0,0],[a,0,0]].forEach(p => makeAtom(...p, caColor, 0.35));
      // 四面体空隙 (8个)
      [[-a/2,-a/2,-a/2],[a/2,-a/2,-a/2],[-a/2,a/2,-a/2],[-a/2,-a/2,a/2],[a/2,a/2,-a/2],[a/2,-a/2,a/2],[-a/2,a/2,a/2],[a/2,a/2,a/2]].forEach(p => makeAtom(...p, fColor, 0.22));
      break;
    }
    case 'diamond': {
      // 金刚石结构
      const cColor = 0x404040;
      // 面心立方位置
      [[-a,-a,-a],[a,-a,-a],[-a,a,-a],[-a,-a,a],[a,a,-a],[a,-a,a],[-a,a,a],[a,a,a]].forEach(p => makeAtom(...p, cColor, 0.3));
      [[0,0,-a],[0,0,a],[0,-a,0],[0,a,0],[-a,0,0],[a,0,0]].forEach(p => makeAtom(...p, cColor, 0.3));
      // 四面体空隙中的4个
      [[-a/2,-a/2,-a/2],[a/2,a/2,-a/2],[a/2,-a/2,a/2],[-a/2,a/2,a/2]].forEach(p => makeAtom(...p, cColor, 0.3));
      break;
    }
    case 'graphite': {
      // 石墨层状结构（简化：显示两层六边形）
      const cColor = 0x404040;
      const r = 0.7;
      for (let layer = 0; layer < 2; layer++) {
        const y = layer === 0 ? -0.5 : 0.5;
        for (let i = 0; i < 6; i++) {
          const angle = i * Math.PI / 3 + (layer * Math.PI / 6);
          makeAtom(r * Math.cos(angle), y, r * Math.sin(angle), cColor, 0.25);
        }
      }
      break;
    }
    case 'dryice': {
      // 干冰：面心立方，CO2分子
      const cColor = 0x404040, oColor = 0xff0d0d;
      const positions = [[-a,-a,-a],[a,-a,-a],[-a,a,-a],[-a,-a,a],[a,a,-a],[a,-a,a],[-a,a,a],[a,a,a],[0,0,-a],[0,0,a],[0,-a,0],[0,a,0],[-a,0,0],[a,0,0]];
      positions.forEach(p => {
        makeAtom(p[0], p[1], p[2], cColor, 0.2);
        makeAtom(p[0] + 0.35, p[1], p[2], oColor, 0.15);
        makeAtom(p[0] - 0.35, p[1], p[2], oColor, 0.15);
      });
      break;
    }
    case 'metal': {
      // Cu型 面心立方
      const cuColor = 0xc88033;
      [[-a,-a,-a],[a,-a,-a],[-a,a,-a],[-a,-a,a],[a,a,-a],[a,-a,a],[-a,a,a],[a,a,a]].forEach(p => makeAtom(...p, cuColor, 0.4));
      [[0,0,-a],[0,0,a],[0,-a,0],[0,a,0],[-a,0,0],[a,0,0]].forEach(p => makeAtom(...p, cuColor, 0.4));
      break;
    }
    default: {
      // 简单立方
      [[-a,-a,-a],[a,-a,-a],[-a,a,-a],[-a,-a,a],[a,a,-a],[a,-a,a],[-a,a,a],[a,a,a]].forEach(p => makeAtom(...p, 0x888888, 0.35));
    }
  }

  // XYZ 坐标轴：挂在晶胞左下后角外侧，沿 -x/-y/-z 方向向外延伸（小号精致，不挡晶胞）
  if (crystalAxesVisible) {
    const axGroup = new THREE.Group();
    axGroup.name = 'crystalAxes';
    createAxes3D(axGroup, {
      origin: [a, a, a],
      axes: [[1, 0, 0], [0, 1, 0], [0, 0, 1]],
      lengths: [1.0, 1.0, 1.0]
    });
    scene.add(axGroup);
  }

  scene.add(group);
}

// ===== 化学结构规律总表（v0.6 统一引擎） =====
